<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f5ef"><title>AI 日报</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root{--paper:#fffdf9;--bg:#f8f5ef;--ink:#2b2925;--muted:#77716a;--line:#ddd6cc;--accent:#c45b36;--soft:#f5e5d9;--green:#668878;--shadow:0 18px 55px rgba(61,49,37,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit}.shell{max-width:1540px;margin:auto;padding:48px 48px 72px}
.masthead{display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:27px;border-bottom:1px solid var(--line)}.eyebrow{margin-bottom:12px;color:var(--accent);font:700 12px/1.2 Inter,sans-serif;letter-spacing:.24em}.brand{margin:0;font:700 35px/1.1 Georgia,"Noto Serif SC",serif;letter-spacing:-.03em}.today{color:var(--muted);font:17px/1.4 Georgia,"Noto Serif SC",serif}
.task-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:29px 0 31px}.task-card{min-height:96px;padding:20px 23px;border:1px solid var(--line);border-radius:14px;background:rgba(255,253,249,.65);cursor:pointer;text-align:left;transition:.18s}.task-card:hover{transform:translateY(-1px);border-color:#c9b8aa}.task-card.active{border-color:var(--accent);background:var(--soft);box-shadow:0 4px 18px rgba(196,91,54,.07)}.task-name{display:block;font:700 19px/1.3 Georgia,"Noto Serif SC",serif}.task-count{display:block;margin-top:8px;color:var(--muted);font-size:13px}
.report-meta{display:flex;align-items:center;justify-content:space-between;margin:0 186px 17px}.current-file{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:14px}.current-file:before{content:"";display:inline-block;width:9px;height:9px;margin-right:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(102,136,120,.12)}.raw-label{color:var(--muted);font-size:12px}
.reader{display:grid;grid-template-columns:180px minmax(0,1fr) 160px;gap:26px;align-items:start}.rail{position:sticky;top:24px;max-height:calc(100vh - 48px);overflow:auto;padding:4px 4px 24px;scrollbar-width:thin;scrollbar-color:#bcb4aa transparent}.rail-title{margin:0 0 13px;color:#615b55;font-size:12px;letter-spacing:.1em}.toc a{display:block;padding:6px 7px;border-left:1px solid transparent;color:#7a746e;font-size:12px;line-height:1.45;text-decoration:none}.toc a:hover,.toc a.active{border-left-color:var(--accent);color:var(--ink)}.toc a.level-2{font-weight:700;color:#48433e}.toc a.level-3{padding-left:14px}
.paper{min-width:0;padding:62px 72px 76px;border:1px solid var(--line);border-radius:17px;background:var(--paper);box-shadow:var(--shadow)}.markdown{font-family:Georgia,"Noto Serif SC","Songti SC",serif;font-size:17px;line-height:1.9}.markdown h1{margin:0 0 34px;padding-bottom:25px;border-bottom:1px solid var(--line);font-size:41px;line-height:1.25;letter-spacing:-.04em}.markdown h2{margin:49px 0 22px;padding:13px 18px;border-left:4px solid var(--accent);border-radius:0 10px 10px 0;background:linear-gradient(90deg,var(--soft),rgba(245,229,217,.35));font-size:23px;line-height:1.4}.markdown h3{margin:38px 0 18px;font-size:20px;line-height:1.5}.markdown p{margin:15px 0}.markdown ul,.markdown ol{padding-left:1.35em}.markdown li{margin:8px 0}.markdown blockquote{margin:25px 0;padding:15px 20px;border-left:3px solid var(--accent);background:#faf2eb;color:#4b4540}.markdown a{color:#9c4328;text-decoration-color:#d6aa97;text-underline-offset:3px}.markdown strong{color:#211f1c}.markdown code{padding:.14em .38em;border-radius:5px;background:#f1ede7;font:85%/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}.markdown pre{overflow:auto;padding:18px;border-radius:10px;background:#2d2b28;color:#f7f2eb}.markdown pre code{padding:0;background:none;color:inherit}.markdown table{display:block;overflow:auto;width:100%;border-collapse:collapse}.markdown th,.markdown td{padding:9px 12px;border:1px solid var(--line)}.markdown img{max-width:100%}
.markdown .field-label{margin:27px 0 8px}.markdown .field-label strong{display:inline-flex;align-items:center;padding:4px 10px;border:1px solid #e5c9ba;border-radius:6px;background:#fbefe8;color:#9c4328;font:700 14px/1.45 Inter,"Noto Sans SC",sans-serif;letter-spacing:.04em}.markdown .field-label+*{margin-top:8px}.markdown .field-primary{margin-top:24px}.markdown .field-primary strong{padding:6px 13px;border-color:var(--accent);background:var(--accent);color:#fff;font-size:15px;letter-spacing:.06em}.markdown .field-primary+ p{margin-top:9px;padding:16px 19px;border-left:4px solid var(--accent);border-radius:0 9px 9px 0;background:linear-gradient(90deg,#fbefe8,#fffaf6);font-size:18px;line-height:1.85}.markdown h3+.field-primary{margin-top:15px}
.archive{position:relative;padding-left:18px}.archive:before{content:"";position:absolute;top:28px;bottom:0;left:4px;width:1px;background:var(--line)}.archive-item{position:relative;display:block;width:100%;margin:0 0 7px;padding:10px 11px;border:0;border-radius:9px;background:transparent;cursor:pointer;text-align:left}.archive-item:before{content:"";position:absolute;top:17px;left:-17px;width:5px;height:5px;border:2px solid var(--bg);border-radius:50%;background:#b8b0a7}.archive-item:hover{background:#f1ece5}.archive-item.active{background:var(--soft)}.archive-item.active:before{background:var(--accent)}.archive-date{display:block;font:700 14px/1.3 Georgia,"Noto Serif SC",serif}.archive-name{display:block;overflow:hidden;margin-top:4px;color:var(--muted);font-size:10px;text-overflow:ellipsis;white-space:nowrap}.empty{padding:80px 20px;color:var(--muted);text-align:center}
@media(max-width:1100px){.shell{padding:32px 24px 60px}.reader{grid-template-columns:150px minmax(0,1fr)}.archive-rail{display:none}.report-meta{margin-right:0}.paper{padding:50px 48px}}@media(max-width:760px){.shell{padding:25px 15px 45px}.masthead{align-items:flex-start}.brand{font-size:30px}.today{font-size:14px}.task-tabs{grid-template-columns:1fr;gap:9px}.task-card{min-height:76px}.reader{display:block}.toc-rail{display:none}.report-meta{margin:0 4px 13px}.paper{padding:35px 23px 48px;border-radius:13px}.markdown{font-size:16px;line-height:1.82}.markdown h1{font-size:30px}.markdown h2{font-size:21px}.markdown .field-primary+ p{padding:13px 15px;font-size:16px}}
</style></head><body><div class="shell">
<header class="masthead"><div><div class="eyebrow">AI DAILY</div><h1 class="brand">AI日报</h1></div><time class="today" id="today"></time></header>
<nav class="task-tabs" aria-label="选择报告类型"><button class="task-card" data-group="brief"><span class="task-name">每日重点简报</span><span class="task-count">0 篇 Markdown</span></button><button class="task-card" data-group="papers"><span class="task-name">搜广推论文报告</span><span class="task-count">0 篇 Markdown</span></button></nav>
<div class="report-meta"><span class="current-file" id="current-file">正在加载</span><span class="raw-label">完整 Markdown 原文</span></div>
<div class="reader"><aside class="rail toc-rail"><div class="rail-title">本页目录</div><nav class="toc" id="toc"></nav></aside><main class="paper"><article class="markdown" id="content"><div class="empty">正在加载日报…</div></article></main><aside class="rail archive-rail"><div class="rail-title">历史归档</div><div class="archive" id="archive"></div></aside></div>
</div><script>
const state={entries:[],group:'brief',current:null},labels={brief:'每日重点简报',papers:'搜广推论文报告'};
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dateOf=e=>(e.title.match(/\d{4}-\d{2}-\d{2}/)||[''])[0];
function slug(t,i){return(t.trim().toLowerCase().replace(/[^\w\u4e00-\u9fff]+/g,'-').replace(/^-|-$/g,'')||'section')+'-'+i}function toc(){const n=document.querySelector('#toc');n.innerHTML='';document.querySelectorAll('#content h2,#content h3').forEach((h,i)=>{h.id=slug(h.textContent,i);const a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent;a.className='level-'+h.tagName.slice(1);n.appendChild(a)})}
const fieldLabels=new Set(['发生了什么','为什么重要','关键技术或数据','我的判断与你的关联','可信度与局限','论文、机构与场景','它解决的旧问题','场景','核心方法','主要创新或优化点','关键结果','收益归因','与你的关联','可信度','风险或局限','是否值得继续精读','是否值得精读']);
function decorateFields(){document.querySelectorAll('#content p').forEach(p=>{const s=p.querySelector(':scope > strong:only-child');if(!s||!fieldLabels.has(s.textContent.trim()))return;p.classList.add('field-label');if(s.textContent.trim()==='发生了什么'||s.textContent.trim()==='论文、机构与场景'||s.textContent.trim()==='场景')p.classList.add('field-primary')})}
function archive(){const n=document.querySelector('#archive');n.innerHTML='';state.entries.filter(e=>e.group===state.group).forEach(e=>{const b=document.createElement('button');b.className='archive-item'+(state.current&&e.path===state.current.path?' active':'');b.innerHTML='<span class="archive-date">'+esc(dateOf(e)||'未标日期')+'</span><span class="archive-name">'+esc(e.title)+'</span>';b.onclick=()=>load(e);n.appendChild(b)})}function tabs(){document.querySelectorAll('.task-card').forEach(b=>{const g=b.dataset.group;b.classList.toggle('active',g===state.group);b.querySelector('.task-count').textContent=state.entries.filter(e=>e.group===g).length+' 篇 Markdown'})}
async function load(e){state.current=e;state.group=e.group;tabs();archive();document.querySelector('#current-file').textContent=e.title+'.md';document.title=e.title+' · AI日报';const n=document.querySelector('#content');n.innerHTML='<div class="empty">正在加载日报…</div>';try{const r=await fetch(encodeURI(e.path),{cache:'no-store'});if(!r.ok)throw Error(r.status);n.innerHTML=marked.parse(await r.text());decorateFields();toc();scrollTo({top:0,behavior:'smooth'})}catch(x){n.innerHTML='<div class="empty">报告加载失败，请稍后刷新。</div>';document.querySelector('#toc').innerHTML=''}}
function select(g){state.group=g;const e=state.entries.find(x=>x.group===g);if(e)load(e);else{state.current=null;tabs();archive();document.querySelector('#current-file').textContent=labels[g];document.querySelector('#content').innerHTML='<div class="empty">暂无报告</div>';document.querySelector('#toc').innerHTML=''}}document.querySelectorAll('.task-card').forEach(b=>b.onclick=()=>select(b.dataset.group));
(async()=>{document.querySelector('#today').textContent=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric'}).format(new Date());try{const r=await fetch('manifest.json',{cache:'no-store'});if(!r.ok)throw Error(r.status);state.entries=await r.json();select(state.entries.some(e=>e.group==='brief')?'brief':'papers')}catch(e){document.querySelector('#content').innerHTML='<div class="empty">目录加载失败，请稍后刷新。</div>'}})();
</script></body></html>
