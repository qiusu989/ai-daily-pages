function decorateInstitutions(){
  const fixed={'快手':24,'Google':215,'Meta':270,'字节跳动':180,'阿里巴巴':42,'腾讯':145,'LinkedIn':200,'Microsoft':330};
  document.querySelectorAll('#content a[href]').forEach(a=>{
    if(a.querySelector('.paper-institution'))return;
    const names=paperInstitutions[a.getAttribute('href')];
    if(!names||!names.length)return;
    const prefix=names.join('、')+'｜';
    let title;
    if(a.textContent.startsWith(prefix))title=a.textContent.slice(prefix.length);
    else{
      // Existing reports can carry a longer affiliation prefix in original order.
      const separator=a.textContent.indexOf('｜');
      if(separator<0)return;
      const oldNames=a.textContent.slice(0,separator).split('、');
      if(!oldNames.some(n=>names.some(label=>label.replace(/等$/,'')===n)))return;
      title=a.textContent.slice(separator+1);
    }
    const fragment=document.createDocumentFragment();
    const folded=names[names.length-1].endsWith('等');
    names.forEach((label,index)=>{
      const name=folded&&index===names.length-1?label.slice(0,-1):label;
      if(index)fragment.append(document.createTextNode('、'));
      let hash=0;for(const c of name)hash=(Math.imul(hash,31)+c.codePointAt(0))>>>0;
      const hue=Object.prototype.hasOwnProperty.call(fixed,name)?fixed[name]:hash%360;
      const badge=document.createElement('span');badge.className='paper-institution';badge.textContent=name;
      badge.style.color=`hsl(${hue} 55% 28%)`;badge.style.backgroundColor=`hsl(${hue} 65% 90%)`;
      fragment.append(badge);
    });
    if(folded)fragment.append(document.createTextNode('等'));
    fragment.append(document.createTextNode('｜'+title));a.replaceChildren(fragment);
  });
}
function decorateFields(){document.querySelectorAll('#content p').forEach(p=>{const s=p.querySelector(':scope > strong:only-child');if(!s)return;p.classList.add('field-label')})}
function decorateReadingOrder(){
  const topicColors=['#37664e','#48658b','#775484','#896038','#367074','#7b515c'];
  document.querySelectorAll('#content h2').forEach(h=>{
    if(!/^(今日|本周)阅读顺序$/.test(h.textContent.trim()))return;
    for(let list=h.nextElementSibling;list&&list.tagName!=='H2';list=list.nextElementSibling){
      if(list.tagName!=='UL'&&list.tagName!=='OL')continue;
      list.querySelectorAll(':scope > li').forEach(li=>{
        if(li.classList.contains('reading-item'))return;
        const row=li.querySelector(':scope > p')||li,prefix=row.firstChild;
        if(!prefix||prefix.nodeType!==Node.TEXT_NODE||!row.querySelector(':scope > a'))return;
        const match=prefix.textContent.match(/^(\s*)(P[012])(\s*[｜|]\s*)([^｜|]+?)(\s*[｜|]\s*)/);
        if(!match)return;
        const priority=document.createElement('strong'),category=document.createElement('span'),fragment=document.createDocumentFragment();
        priority.className='reading-priority';priority.dataset.priority=match[2];priority.textContent=match[2];
        category.className='reading-category';category.textContent=match[4];
        let hash=0;for(const c of match[4].trim())hash=(Math.imul(hash,31)+c.codePointAt(0))>>>0;
        category.style.color=topicColors[hash%topicColors.length];
        fragment.append(document.createTextNode(match[1]),priority,document.createTextNode(match[3]),category,document.createTextNode(match[5]+prefix.textContent.slice(match[0].length)));
        prefix.replaceWith(fragment);li.classList.add('reading-item');
      });
    }
  });
}
function archive(){const n=document.querySelector('#archive');n.innerHTML='';state.entries.filter(e=>e.group===state.group).forEach(e=>{const b=document.createElement('button');b.className='archive-item'+(state.current&&e.path===state.current.path?' active':'');b.innerHTML='<span class="archive-date">'+esc(dateOf(e)||'未标日期')+'</span><span class="archive-name">'+esc(e.title)+'</span>';b.onclick=()=>load(e);n.appendChild(b)})}function tabs(){document.querySelectorAll('.task-card').forEach(b=>{const g=b.dataset.group;b.classList.toggle('active',g===state.group);b.querySelector('.task-count').textContent=state.entries.filter(e=>e.group===g).length+' 篇 Markdown'})}
async function load(e){state.current=e;state.group=e.group;tabs();archive();document.querySelector('#current-file').textContent=e.title+'.md';document.title=e.title+' · AI日报';const n=document.querySelector('#content');n.innerHTML='<div class="empty">正在加载日报…</div>';try{const r=await fetch(encodeURI(e.path),{cache:'no-store'});if(!r.ok)throw Error(r.status);n.innerHTML=marked.parse(await r.text());decorateInstitutions();decorateFields();decorateReadingOrder();toc();scrollTo({top:0,behavior:'smooth'})}catch(x){n.innerHTML='<div class="empty">报告加载失败，请稍后刷新。</div>';document.querySelector('#toc').innerHTML=''}}
function select(g){state.group=g;const e=state.entries.find(x=>x.group===g);if(e)load(e);else{state.current=null;tabs();archive();document.querySelector('#current-file').textContent=labels[g];document.querySelector('#content').innerHTML='<div class="empty">暂无报告</div>';document.querySelector('#toc').innerHTML=''}}document.querySelectorAll('.task-card').forEach(b=>b.onclick=()=>select(b.dataset.group));
(async()=>{document.querySelector('#today').textContent=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric'}).format(new Date());try{const r=await fetch('manifest.json',{cache:'no-store'});if(!r.ok)throw Error(r.status);state.entries=await r.json();select(state.entries.some(e=>e.group==='brief')?'brief':'papers')}catch(e){document.querySelector('#content').innerHTML='<div class="empty">目录加载失败，请稍后刷新。</div>'}})();
</script></body></html>
